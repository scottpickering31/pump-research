services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pump_research
      POSTGRES_USER: pump_research
      POSTGRES_PASSWORD: pump_research
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pump_research -d pump_research"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  postgres_data:
